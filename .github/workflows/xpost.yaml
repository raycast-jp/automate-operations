on:
  schedule:
    - cron: "21 10 * * *"
  workflow_dispatch:

jobs:
  xpost:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    name: A job to test a post tweet action
    steps:
      - name: Get current date
        id: get-date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Notion post fetcher
        id: notion-post-fetcher
        uses: raycast-jp/notion-post-fetcher@v0.1.0
        with:
          targetDate: ${{ env.CURRENT_DATE }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-db-id: ${{ secrets.NOTION_DB_ID }}
      - name: Print Output Tweet Content
        id: output-tweet-content
        run: |
          echo "Tweet Content: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).content }}"
      - name: Print Output Tweet Media
        id: output-tweet-media
        run: |
          echo "Tweet Media: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).media }}"
      - name: Print Output Thread Content
        id: output-thread-content
        run: |
          echo "Thread Content: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).thread.content }}"
      - name: Print Output Thread Media
        id: output-thread-media
        run: |
          echo "Thread Media: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).thread.media }}"
      - name: Post tweet
        id: tweetx
        uses: raycast-jp/post-tweet-v2-action@v0.2.0
        with:
          message: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).content }}
          media: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).media }}
          thread-message: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).thread.content }}
          thread-media: ${{ fromJson(steps.notion-post-fetcher.outputs.tweet).thread.media }}
          consumer-key: ${{ secrets.TWITTER_CONSUMER_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      - name: Print Output Published TweetID
        id: output-published-tweet-id
        run: echo "${{ steps.tweetx.outputs.tweetID }}"
      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "只今ツイートしましたのでいいね、リツイートなどリアクションお願いします！！\nhttps://x.com/Raycast0731/status/${{ steps.tweetx.outputs.tweetID }}"
      # Use the output from the `hello` step
      - name: Get the output time
        run: echo "it was succeeded on ${{ steps.hello.outputs.time }}"
      - name: Notify error via slack
        if: failure()
        id: error-notifier
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "投稿に失敗しました。エラー内容を確認してください: ${{ steps.tweetx.outputs.postFailed }} \n 実行結果の詳細はこちら: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
